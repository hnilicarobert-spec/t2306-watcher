<html lang="en">
<head>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

<body>

<h1>T2306 Watcher</h1>

<p class="subtitle">
  Possible listings found by the latest automated scan.
</p>

<div id="status">
  Loading watcher status…
</div>

<h2 class="section-title">Latest possible listings</h2>

<div id="app">
  Loading…
</div>

<script>

async function loadDashboard(){

  try{

    const [stateResponse, resultsResponse] = await Promise.all([
      fetch("state.json?" + Date.now()),
      fetch("results.json?" + Date.now())
    ]);

    if(!stateResponse.ok){
      throw new Error("Could not load state.json");
    }

    if(!resultsResponse.ok){
      throw new Error("Could not load results.json");
    }

    const state = await stateResponse.json();
    const rows = await resultsResponse.json();

    /*
     * Last successful scan
     */
    let lastScan = "Never";

    if(state.last_scan){

      const date = new Date(state.last_scan);

      if(!isNaN(date.getTime())){
        lastScan = date.toLocaleString([], {
          year:"numeric",
          month:"short",
          day:"numeric",
          hour:"2-digit",
          minute:"2-digit"
        });
      }
    }

    /*
     * Websites checked by watcher.py
     */
    const websites = state.websites_checked || [];

    /*
     * Friendly names for the domains
     */
    const websiteNames = {
      "bazos.cz":"Bazoš Czech",
      "bazos.sk":"Bazoš Slovakia",
      "aukro.cz":"Aukro Czech",
      "aukro.sk":"Aukro Slovakia",
      "sbazar.cz":"Sbazar",
      "facebook.com/marketplace":"Facebook Marketplace",
      "modrykonik.cz":"Modrý koník",
      "odklepnuto.cz":"Odklepnuto",
      "ebay.de":"eBay Germany",
      "ebay.com":"eBay"
    };

    /*
     * Build status section
     */
    document.getElementById("status").innerHTML = `

      <div class="status-card">

        <div class="status-title">
          Last refresh
        </div>

        <div class="status-time">
          ${escapeHtml(lastScan)}
        </div>

        <div class="status-ok">
          ✓ Scan completed
        </div>

        <button id="refreshButton" onclick="refreshNow()">
          🔄 Refresh now
        </button>

      </div>

      <div class="status-card">

        <div class="status-title">
          Websites checked
        </div>

        <div class="websites">

          ${
            websites.length

            ? websites.map(site => `

                <div class="website">

                  <span class="check">✓</span>

                  ${escapeHtml(
                    websiteNames[site] || site
                  )}

                </div>

              `).join("")

            : `
              <div class="empty">
                No website information available yet.
              </div>
            `
          }

        </div>

      </div>

    `;

    /*
     * Display listings
     */
    document.getElementById("app").innerHTML =

      rows.length

      ? rows.map(x => `

          <article class="card">

            <div class="score">
              ${Number(x.match || 0)}% visual match
            </div>

            <h2>
              ${escapeHtml(x.title || "Untitled")}
            </h2>

            ${
              x.image

              ? `
                <img
                  src="${escapeHtml(x.image)}"
                  loading="lazy"
                  alt="Listing image"
                >
              `

              : ""
            }

            <p>
              ${escapeHtml(x.reason || "")}
            </p>

            <a
              href="${escapeHtml(x.url)}"
              target="_blank"
              rel="noopener"
            >
              Open listing
            </a>

          </article>

        `).join("")

      : `
        <p class="empty">
          No matches yet.
        </p>
      `;

  }

  catch(error){

    console.error(error);

    document.getElementById("status").innerHTML = `

      <div class="status-card">

        <div class="status-title">
          Watcher status
        </div>

        <div>
          Could not load watcher status.
        </div>

        <button
          id="refreshButton"
          onclick="loadDashboard()"
          style="margin-top:14px"
        >
          ↻ Try again
        </button>

      </div>

    `;

    document.getElementById("app").innerHTML =
      `<p class="empty">Could not load results.</p>`;
  }

}


/*
 * Manual refresh
 *
 * IMPORTANT:
 * This button is currently only the UI.
 * We will connect it to GitHub Actions in the next step.
 */
async function refreshNow(){

  const button =
    document.getElementById("refreshButton");

  if(!button){
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ Refreshing…";

  /*
   * Temporary behavior:
   * wait briefly and reload the dashboard.
   *
   * The next step will replace this with
   * a real GitHub Actions trigger.
   */
  setTimeout(async () => {

    button.disabled = false;
    button.textContent = "🔄 Refresh now";

    await loadDashboard();

  }, 1500);

}


/*
 * Protect the page against HTML contained
 * in listing titles/reasons.
 */
function escapeHtml(value){

  return String(value).replace(
    /[&<>"']/g,
    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[character])
  );

}


/*
 * Initial load
 */
loadDashboard();

</script>

</body>
</html>
